services:

  backend:
    build: ./backend
    container_name: credit-debit-backend-container
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: credit-debit-frontend-container
    ports:
      - "5173:80"
    depends_on:
      - backend